[platformio]
default_envs = tile_esp32s3

[env]
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -Wextra

[env:tile_esp32s3]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
monitor_speed = 115200
# Opening or closing the native USB CDC monitor must not toggle reset control
# lines. On the first ESP32-S3 board this caused a full reboot, released the
# 15-second server lease and returned the LCD to the CONNECTING page.
monitor_dtr = 0
monitor_rts = 0
build_src_filter =
    +<*>
    -<demo_engine.cpp>
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit ST7735 and ST7789 Library@1.11.0
    bblanchon/ArduinoJson@7.4.2

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter =
    +<tile_model.cpp>
    +<demo_engine.cpp>
    +<tile_assignment.cpp>
    +<tile_connection_view.cpp>
    -<main.cpp>
